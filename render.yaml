# Render Blueprint — https://render.com/docs/blueprint-spec
# Live: https://cyber-security-agent.onrender.com
# Repo branch: main. Secrets stay in the dashboard / CLI — never commit .env.
# Free plan: no disk; start.sh rebuilds data/chroma on a cold start.
services:
  - type: web
    name: cyber-security-agent
    runtime: python
    plan: free
    repo: https://github.com/pradeepgnd/cyber-security-agent
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start.sh
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: CACHE_MODE
        value: frozen
      - key: USE_NATIVE_STRUCTURED_OUTPUT
        value: "false"
      - key: SUPERVISOR_MAX_ITERATIONS
        value: "8"
      - key: SUPERVISOR_MAX_VISITS_PER_AGENT
        value: "1"
      - key: SUPERVISOR_ABSOLUTE_MAX
        value: "12"
      - key: CACHE_TTL_DEFAULT
        value: "86400"
      - key: CACHE_TTL_KEV
        value: "21600"
      - key: CACHE_TTL_NEGATIVE
        value: "3600"
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_PROJECT
        value: cyber-security-agent
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: GITHUB_ENABLED
        sync: false
      - key: GITHUB_API_URL
        value: https://api.github.com
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_MIN_SEVERITY
        value: high
